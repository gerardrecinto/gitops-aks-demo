apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: items-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: items-api
    spec:
      serviceAccountName: items-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: items-api
          image: ghcr.io/gerardrecinto/gitops-aks-demo
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: items-api-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: items-api-secrets
                  key: API_KEY
                  optional: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
