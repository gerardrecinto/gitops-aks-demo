apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base
replicas:
  - name: items-api
    count: 1
configMapGenerator:
  - name: items-api-config
    literals:
      - APP_ENV=dev
# CI (dev) and the promote workflow (prod) rewrite newTag. Nothing else edits it.
images:
  - name: ghcr.io/gerardrecinto/gitops-aks-demo
    newTag: "sha-doesnotexist"
