apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
replicas:
  - name: items-api
    count: 2
configMapGenerator:
  - name: items-api-config
    literals:
      - APP_ENV=prod
# CI (dev) and the promote workflow (prod) rewrite newTag. Nothing else edits it.
images:
  - name: ghcr.io/gerardrecinto/gitops-aks-demo
    newTag: "sha-d9b11b8b39a6ba4fae25a2fa99248a454bd30691"
