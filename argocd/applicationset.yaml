# One template, two environments. dev and prod share the exact same sync policy.
# Prod only changes when someone approves the promote workflow, because that is
# the only thing that edits k8s/overlays/prod.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: items-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: "items-api-{{.env}}"
    spec:
      project: demo
      source:
        repoURL: https://github.com/gerardrecinto/gitops-aks-demo.git
        targetRevision: main
        path: "k8s/overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "demo-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
