name: promote

# Copies an image tag into the prod overlay. The "production" environment holds
# required reviewers, so the job waits for a human approval before it commits.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to promote. Empty means whatever dev runs now.
        required: false

permissions:
  contents: read

concurrency: promote

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(yq '.images[0].newTag' k8s/overlays/dev/kustomization.yaml)}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Refuse tags that are not in the registry
        env:
          REF: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
        run: docker buildx imagetools inspect "$REF" > /dev/null

      - uses: ./.github/actions/set-image-tag
        with:
          env: prod
          tag: ${{ steps.tag.outputs.tag }}
